# Application Configuration
server.port=8080
spring.application.name=college-event-registration-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/college_event_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:9866874074}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Logging Configuration
logging.level.com.college.eventregistration=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
